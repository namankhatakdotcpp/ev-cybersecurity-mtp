# Gate 6 (REDUCED) configuration. Written and committed before the first Gate 6 run.
# Protocol v1 allowed interpretability (SHAP, permutation importance) for the selected model. No model beat the exposure-only
# reference B0 in Gate 3, so interpretability of a model without signal would describe noise. Deliberate protocol reduction (D072):
# descriptive coefficients and error analysis for B0 only. Nothing here is a hypothesis test; all of it is exploratory.
inherits: configs/gate3_grid.yaml
target_set: eligible_primary          # the 492-row T1 primary set used in Gates 2-3
reference_model: B0                   # exposure offset + n_available + incident_mode + period dummies
final_fit:
  ridge_C_selection: {grid_from: gate3, inner_folds: 3, seed: 5000}   # same inner rule as Gate 2/3, applied to all 492 rows
  unpenalised: glm_binomial_with_offset_cluster_robust_by_participant
bootstrap: {resamples: 2000, seed: 6060, unit: participant}
oof_source: g3_grid_ridge             # Gate 3 out-of-fold B0 predictions (20 repeats); reused, not refitted
strata:
  n_attacked: [n_attacked]
  n_available: [n_available]
  exposure_cell: [n_attacked, n_available]      # p_exp = 1/2, 1/3, 2/3
  trial_index_bins: [[1, 5], [6, 10], [11, 15], [16, 20]]
  period: [apr, jun, jul_aug]
  incident_mode: [0, 1]
min_events_for_stratum_auroc: 20       # and at least 20 non-events; otherwise reported as n/a
